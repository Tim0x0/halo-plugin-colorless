apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: plugin-colorless
spec:
  enabled: true
  requires: ">=2.26.0"
  author:
    name: Tim0x0
    website: https://github.com/Tim0x0
  logo: logo.svg
  homepage: https://github.com/Tim0x0/halo-plugin-colorless#readme
  repo: https://github.com/Tim0x0/halo-plugin-colorless
  issues: https://blog.timxs.com/bbs?category=misc-plugins
  displayName: 无色界
  settingName: plugin-colorless-setting
  configMapName: plugin-colorless-config
  description: 在公祭日、纪念日等指定日期让站点整天显示为灰白效果，结束后自动恢复；也可以手动一键变灰。
  license:
    - name: "GPL-3.0"
      url: "https://github.com/Tim0x0/halo-plugin-colorless/blob/main/LICENSE"
