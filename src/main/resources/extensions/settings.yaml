apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-colorless-setting
spec:
  forms:
    - group: basic
      label: 基本设置
      formSchema:
        - $formkit: radio
          name: scope
          label: 作用范围
          value: false
          options:
            - value: true
              label: 全站
            - value: false
              label: 仅首页
        - $formkit: switch
          name: manual
          label: 手动变灰
          value: false
          help: 开启后立即变灰，直到手动关闭；关闭后仍按清明与纪念日判断
        - $formkit: switch
          name: qingming
          label: 清明
          value: true
          help: 按节气公式计算，每年 4 月 4 日或 5 日当天变灰
        - $formkit: array
          name: memorialDays
          label: 纪念日
          help: 命中任意一条即当天变灰（按下方时区的 0 点到 24 点）。连续多天请添加多条
          addLabel: 添加纪念日
          emptyText: 暂无纪念日
          itemLabels:
            - type: text
              label: $value.name
          value:
            - name: 汶川地震纪念日
              type: yearly
              month: "5"
              day: "12"
            - name: 七七事变纪念日
              type: yearly
              month: "7"
              day: "7"
            - name: 九一八事变纪念日
              type: yearly
              month: "9"
              day: "18"
            - name: 烈士纪念日
              type: yearly
              month: "9"
              day: "30"
            - name: 南京大屠杀死难者国家公祭日
              type: yearly
              month: "12"
              day: "13"
          children:
            - $formkit: text
              name: name
              label: 名称
              value: ""
              validation: required
            - $formkit: radio
              name: type
              key: type
              label: 类型
              value: yearly
              help: 每年重复只选月和日；指定日期仅当天生效
              options:
                - value: yearly
                  label: 每年重复
                - value: absolute
                  label: 指定日期
            - $formkit: select
              name: month
              key: month
              if: "$value.type === yearly"
              label: 月份
              value: ""
              validation: required
              autoSelect: false
              options:
                - label: 1月
                  value: "1"
                - label: 2月
                  value: "2"
                - label: 3月
                  value: "3"
                - label: 4月
                  value: "4"
                - label: 5月
                  value: "5"
                - label: 6月
                  value: "6"
                - label: 7月
                  value: "7"
                - label: 8月
                  value: "8"
                - label: 9月
                  value: "9"
                - label: 10月
                  value: "10"
                - label: 11月
                  value: "11"
                - label: 12月
                  value: "12"
            - $formkit: select
              name: day
              key: day-31
              if: "$value.type === yearly && ($value.month == 1 || $value.month == 3 || $value.month == 5 || $value.month == 7 || $value.month == 8 || $value.month == 10 || $value.month == 12)"
              label: 日期
              value: ""
              validation: required
              autoSelect: false
              options:
                - label: 1日
                  value: "1"
                - label: 2日
                  value: "2"
                - label: 3日
