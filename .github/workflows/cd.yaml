name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v4
    permissions:
      contents: write
    with:
      skip-node-setup: true
      java-version: 21
      # 只把 jar 附到 GitHub Release，不推送 Halo 应用市场
      skip-appstore-release: true
